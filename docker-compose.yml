services:
  # Conversation history and document records. Only reachable from this machine.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leagle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leagle}
      POSTGRES_DB: leagle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leagle -d leagle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
