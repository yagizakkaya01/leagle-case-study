server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # The PDF viewer's worker is an ES module; browsers refuse it with the default type.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
    }

    # API calls go to the backend container; the browser only talks to this origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 11m;   # 10 MB upload limit + multipart overhead
        # Between two stream events the backend may run tools and a model call (up to 180 s);
        # stay well above that so a slow answer is not cut off here.
        proxy_read_timeout 600s;
    }
}
