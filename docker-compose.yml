# Full stack: docker compose up --build  ->  http://localhost:8080
# Only the frontend port is meant for the browser; all ports bind to 127.0.0.1.
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env   # NVIDIA_API_KEY etc.; optional
        required: false
    environment:
      DATABASE_URL: postgresql://leagle:${POSTGRES_PASSWORD:-leagle}@db:5432/leagle
      TRUSTED_PROXY_HOPS: "1"   # requests arrive through the frontend's nginx
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    ports:
      - "127.0.0.1:8000:8000"   # API docs at http://localhost:8000/docs
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started

  # Conversation history and document records.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leagle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leagle}
      POSTGRES_DB: leagle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leagle -d leagle"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local Azure Blob Storage emulator for uploaded PDFs. To use a real storage
  # account instead, override AZURE_STORAGE_CONNECTION_STRING for the backend.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - blob_data:/data

volumes:
  db_data:
  blob_data:
