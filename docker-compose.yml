services:
  # Conversation history and document records. Only reachable from this machine.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leagle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leagle}
      POSTGRES_DB: leagle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leagle -d leagle"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local Azure Blob Storage emulator; set AZURE_STORAGE_CONNECTION_STRING to use it
  # (or point the same variable at a real storage account).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - blob_data:/data

volumes:
  db_data:
  blob_data:
