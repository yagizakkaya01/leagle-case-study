name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leagle
          POSTGRES_PASSWORD: leagle
          POSTGRES_DB: leagle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leagle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL and Azure Blob variants of the tests. No LLM key is
      # needed: chat tests use a scripted fake model.
      TEST_DATABASE_URL: postgresql://leagle:leagle@127.0.0.1:5432/leagle
      TEST_AZURE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
    steps:
      - uses: actions/checkout@v4
      - name: Start Azurite (blob emulator)
        run: >-
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
